# Factor-conditioned local cross-attention denoiser case config.
# Inherits everything from cfg_globalcnn_charbonnier.yaml (channels,
# normaliser, recon weights, training schedule, cache, prefill
# workers, DDP plumbing). Only the model section differs.
#
# Architecture: at every output cell, the centre cell's token issues
# `depth` cross-attention queries over its K x K input patch (K =
# `kernel`). The K/V tokens come from a learned linear projection of
# the patch cells' input channels + a learned per-position embedding.
# FiLM on the centre token, conditioned on (log sigma2_in,
# log sigma2_out), modulates each layer's output.
#
# Receptive field is K x K cells -- structural, not architectural --
# so this is a *local* denoiser by the same definition as cfg_local-
# cnn_charbonnier.yaml. With K = 11 the RF is 11 x 11, comparable to
# the local CNN's depth = 4 (RF = 17 x 17). The attention model is
# ~10x slower at inference than the local CNN with the same RF; it
# is being trained for offline comparison only, not for inline use
# in WarpX.
#
# Run as `run_denoise.sh -c localattention_charbonnier all`.

base: cfg_globalcnn_charbonnier.yaml

model:
  name: localAttention
  base_channels: 32       # d_model -- token embedding width
  depth: 2                # cross-attention layers (each = MHA + FFN + FiLM)
  kernel: 11              # patch size K -- receptive field is K x K cells
  # `activation`, `time_embed_dim` inherited from the framework
  # default. `diffusion_steps` ignored on the single-shot path.
