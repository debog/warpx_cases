# Physics-informed loss variant of the global U-Net config. Inherits
# the channel set, normaliser, data + training pipeline, and the
# per-channel recon weights from cfg_globalcnn_charbonnier.yaml; adds
# the physics-informed loss terms and the non-negativity output head.
#
# This file holds the shared physics loss block: the localcnn /
# diffusion / localattention physics configs inherit THIS file and
# override only their model section, so the loss bundle lives in one
# place (same inheritance style as the *_charbonnier configs).
#
# Run as `run_denoise.sh -c globalcnn_physics all`.

base: cfg_globalcnn_charbonnier.yaml

model:
  # Clamp num / ene / part_per_cell at physical zero. No-op at
  # construction (deposited inputs are >= 0, so the zero-init identity
  # holds) and for the log-zscored num; binds the zscored energy moments.
  enforce_positivity: true

loss:
  # recon_kind / recon_eps / recon_weights are deep-merged from
  # cfg_globalcnn_charbonnier.yaml (jz weighted 5, etc.). The physics
  # weights below are relative to the recon weight of 1.0.

  # --- Charge continuity, turned up -------------------------------------
  # The implicit PIC algorithm is charge- AND energy-conserving, so
  # div(J) = -d(rho)/dt holds EXACTLY for the deposited fields. Charge
  # continuity is therefore a hard physical constraint, not a soft prior,
  # and it is exactly what the JFNK field solver needs from the denoised
  # current: it couples the noisy, ~zero-mean in-plane currents (jx, and
  # jz) to the well-resolved jz / density via d(jx)/dx ~ -d(jz)/dz,
  # instead of reconstructing their deposition noise. Weighted comparably
  # to the dominant jz recon weight; tune down if it over-constrains.
  charge_continuity: 5.0
  # Restrict the constraint to |k| < 0.5 * Nyquist. Continuity holds
  # exactly for the deposited fields *including* their deposition noise,
  # so the high-k tail of div(J_GT) is noise we do not want the
  # prediction to reproduce; the lowpass keeps the constraint on the
  # signal-bearing scales.
  charge_continuity_cutoff: 0.5

  # --- Moment-closure self-consistency ----------------------------------
  # Predicted (num, p_i, ene_i) must satisfy P_i = n m Var(v_i). Ties the
  # density / momentum / energy channels together under the closure.
  closure_consistency: 1.0

  # --- Anti-collapse / band-limit / no mean drift -----------------------
  gradient: 0.2            # L2 of the spatial finite-diff of the error
  gradient_kind: l2
  spectral: 0.1            # gentle Fourier-space penalty ...
  spectral_cutoff: 0.5     # ... restricted to the signal band
  conservation: 0.1        # per-channel cell-mean match (no constant drift)

  # --- Energy conservation: physically valid but dormant ----------------
  # The algorithm conserves energy, so this term is physically justified,
  # but it needs consecutive-step snapshot pairs (W_kin at step n and
  # n+1) and the factor dataset yields same-step (N, M) pairs only.
  # Leaving it at 0; turning it up would only log a warning and
  # contribute zero until the consecutive-step data path is wired.
  energy_conservation: 0.0
