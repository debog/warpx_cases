# Local CNN denoiser (small receptive field). Inherits data, channels,
# training schedule, recon weights, and the physics-informed loss
# bundle from base.yaml; this file sets only the model section.
#
# depth 4 stacked FiLM conv blocks (each = two 3x3 convs) give a
# receptive field of 4*4 + 1 = 17 cells -- well below the slab width
# (~150 cells), so the network cannot reach across the plasma column.
#
# Run as `run_denoise.sh -c localcnn_charbonnier all`.

base: base.yaml

model:
  name: localCNN
  base_channels: 32
  depth: 4                # RF = 4*4 + 1 = 17x17
