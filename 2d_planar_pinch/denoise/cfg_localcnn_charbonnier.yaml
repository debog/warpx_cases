# Local CNN with the physics-informed loss bundle. Inherits the loss
# block + positivity head from cfg_globalcnn_physics.yaml; overrides
# only the model section to the local CNN (RF 17x17). Mirrors
# cfg_localcnn_charbonnier.yaml's model section.
#
# Run as `run_denoise.sh -c localcnn_physics all`.

base: cfg_globalcnn_physics.yaml

model:
  name: localCNN
  base_channels: 32
  depth: 4                # RF = 4*4 + 1 = 17x17
