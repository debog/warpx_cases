# Global U-Net denoiser. Inherits data, channels, training schedule,
# recon weights, and the physics-informed loss bundle from base.yaml;
# this file sets only the model section.
#
# Run as `run_denoise.sh -c globalcnn_charbonnier all`.

base: base.yaml

model:
  name: unet
  base_channels: 32
  depth: 3
