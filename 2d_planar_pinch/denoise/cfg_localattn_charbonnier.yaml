# Local cross-attention denoiser. Inherits data, channels, training
# schedule, recon weights, and the physics-informed loss bundle from
# base.yaml; this file sets only the model section.
#
# Run as `run_denoise.sh -c localattn_charbonnier all`.

base: base.yaml

model:
  name: localAttention
  base_channels: 32       # d_model -- token embedding width
  depth: 2                # cross-attention layers
  kernel: 11              # patch size K -- receptive field is K x K cells
