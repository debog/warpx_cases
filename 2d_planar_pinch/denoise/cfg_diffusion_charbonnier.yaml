# Diffusion U-Net with the physics-informed loss bundle. Inherits the
# loss block + positivity head from cfg_globalcnn_physics.yaml;
# overrides only the model section. Mirrors
# cfg_diffusion_charbonnier.yaml's model section.
#
# The physics terms act on (pred, target) on the output-channel subset,
# identically to the single-shot path: in the diffusion branch the
# network's recovered estimate is compared to the clean target at every
# training step, so charge continuity / closure / spectral apply
# unchanged. The K-step sampler at inference clamps positivity at each
# step.
#
# Run as `run_denoise.sh -c diffusion_physics all`.

base: cfg_globalcnn_physics.yaml

model:
  name: diffusionUNet
  diffusion_steps: 8
